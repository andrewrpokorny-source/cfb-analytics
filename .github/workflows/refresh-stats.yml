name: Refresh stats

# Rebuilds site_data/ from ESPN play-by-play (no API keys needed) and commits
# it; Streamlit Community Cloud redeploys on the push.
on:
  schedule:
    - cron: "0 13 * * 0"   # Sunday 13:00 UTC (~9am ET): after Saturday's games
    - cron: "0 13 * * 3"   # Wednesday 13:00 UTC: picks up Tue/Wed MACtion
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - run: pip install -r requirements-build.txt

      # Final-game summaries never change; keep them between runs so each
      # refresh only downloads the new week's games.
      - uses: actions/cache@v4
        with:
          path: espn_cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: espn-cache-

      - name: Build current season
        run: python -m cfbsite.build

      - name: Commit if changed
        run: |
          git config user.name  "stats-refresh[bot]"
          git config user.email "stats-refresh[bot]@users.noreply.github.com"
          git add site_data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh stats ($(date -u +%Y-%m-%d))"
            git push
          fi
